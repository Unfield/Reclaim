name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    # The app uses macOS 26 SDK APIs (Liquid Glass), so it needs Xcode 26+.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: swift --version

      - name: Test
        run: ./scripts/test.sh

      - name: Build universal app
        env:
          ARCHS: arm64 x86_64
          VERSION: 0.0.0-ci.${{ github.run_number }}
        run: ./scripts/package.sh

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Reclaim-ci-${{ github.run_number }}
          path: dist/
          retention-days: 14
