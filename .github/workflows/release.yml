name: Release

# Push a tag like `v0.3.0` to build, package and publish a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.3.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # Optional: set these repository secrets to ship a signed and notarized build.
      # Without them the release is ad-hoc signed (users open it via right-click → Open).
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
      # In-app updates (Sparkle) and the Homebrew tap.
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check version
        run: |
          SOURCE_VERSION="$(sed -n 's/.*static let version = "\(.*\)".*/\1/p' Sources/ReclaimCore/Version.swift)"
          if [ "v$SOURCE_VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG doesn't match ReclaimInfo.version ($SOURCE_VERSION) in Sources/ReclaimCore/Version.swift"
            exit 1
          fi

      - name: Test
        run: ./scripts/test.sh

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          echo "SIGN_IDENTITY=$DEVELOPER_ID" >> "$GITHUB_ENV"

      - name: Build & package
        env:
          ARCHS: arm64 x86_64
        run: |
          export VERSION="${TAG#v}"
          ./scripts/package.sh

      - name: Sign update and write appcast
        if: env.SPARKLE_PRIVATE_KEY != ''
        run: |
          VERSION="${TAG#v}"
          SIGN_UPDATE="$(find .build/artifacts -path '*Sparkle/bin/sign_update' -type f | head -1)"
          KEY_FILE="$RUNNER_TEMP/sparkle_key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          SIGNATURE="$("$SIGN_UPDATE" --ed-key-file "$KEY_FILE" "dist/Reclaim-$VERSION.zip")"
          rm "$KEY_FILE"
          BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' build/Reclaim.app/Contents/Info.plist)"
          PUB_DATE="$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')"
          cat > dist/appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Reclaim</title>
              <item>
                <title>Reclaim $VERSION</title>
                <pubDate>$PUB_DATE</pubDate>
                <sparkle:version>$BUILD_NUMBER</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <sparkle:releaseNotesLink>https://github.com/Unfield/Reclaim/releases/tag/$TAG</sparkle:releaseNotesLink>
                <enclosure url="https://github.com/Unfield/Reclaim/releases/download/$TAG/Reclaim-$VERSION.zip" type="application/octet-stream" $SIGNATURE />
              </item>
            </channel>
          </rss>
          EOF
          cat dist/appcast.xml

      - name: Write release notes
        run: |
          VERSION="${TAG#v}"
          {
            echo "## Download"
            echo
            echo "- **Reclaim-$VERSION.dmg**: open it and drag Reclaim to Applications"
            echo "- **reclaim-cli-$VERSION-macos.tar.gz**: the command-line tool"
            echo
            echo "Universal build for Apple silicon and Intel, macOS 14 or later."
            echo
            if [ -z "$SIGN_IDENTITY" ] || [ "$SIGN_IDENTITY" = "-" ]; then
              echo "> [!NOTE]"
              echo "> This build isn't notarized by Apple. The first time, **right-click Reclaim.app → Open → Open**,"
              echo "> or run \`xattr -dr com.apple.quarantine /Applications/Reclaim.app\`."
              echo
            fi
            # Include this version's section from CHANGELOG.md, if there is one.
            awk -v v="$VERSION" '
              $0 ~ "^## \\[?"v"\\]?" { found=1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Reclaim ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" $PRERELEASE
          fi

      - name: Check out Homebrew tap
        if: env.HOMEBREW_TAP_DEPLOY_KEY != '' && !contains(env.TAG, '-')
        uses: actions/checkout@v7
        with:
          repository: Unfield/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: homebrew-tap

      - name: Update Homebrew cask
        if: env.HOMEBREW_TAP_DEPLOY_KEY != '' && !contains(env.TAG, '-')
        run: |
          VERSION="${TAG#v}"
          SHA="$(shasum -a 256 "dist/Reclaim-$VERSION.dmg" | cut -d' ' -f1)"
          mkdir -p homebrew-tap/Casks
          sed -e "s/__VERSION__/$VERSION/" -e "s/__SHA256__/$SHA/" packaging/homebrew/reclaim.rb > homebrew-tap/Casks/reclaim.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/reclaim.rb
          git diff --cached --quiet || git commit -m "reclaim $VERSION"
          git push
