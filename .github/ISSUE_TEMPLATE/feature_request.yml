name: Feature request
description: Suggest a new cleanup category, tool, or improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Reclaim to do?
    validations:
      required: true
  - type: textarea
    id: paths
    attributes:
      label: Paths or commands involved
      description: For new cleanup categories, where does the data live, and how sure are you that it's safe to remove?
